# tmux configuration
#
# Every default key binding is left alone, so what you learn here is real tmux
# and transfers to any machine. The prefix is still Ctrl-b. Everything below
# either changes a setting (not a key) or adds a key that tmux leaves unbound.
#
# Cheat sheet: .config/tmux/CHEATSHEET.md

# --- comfort -----------------------------------------------------------------

# Click a pane to focus it, drag a border to resize, scroll to look back.
# Learning is easier when you can still point at things.
set -g mouse on

# The 2000-line default loses the beginning of a long agent run.
set -g history-limit 50000

# True colour, matching the terminal tmux was launched from.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-ghostty:Tc,alacritty:Tc"

# Windows and panes count from 1, because the keys you press are 1-9.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Escape is a key, not the start of a sequence — matters in Neovim.
set -sg escape-time 10

# Let the window name follow whatever is running in it.
setw -g automatic-rename on
set -g set-titles on
set -g set-titles-string "#S / #W"

# Long-lived sessions: don't resize a window to the smallest attached client
# unless that client is actually looking at it.
setw -g aggressive-resize on

# --- status bar --------------------------------------------------------------
# Kanagawa, to match the Neovim theme.

set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1f1f28,fg=#727169"

set -g status-left-length 30
set -g status-left " #[fg=#7e9cd8,bold]#S#[default]  "

set -g status-right-length 40
set -g status-right "#[fg=#727169]#{?client_prefix,#[fg=#e46876]PREFIX  ,}%H:%M "

setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[fg=#dcd7ba,bg=#2d4f67,bold] #I #W "
setw -g window-status-activity-style "fg=#ffa066"

set -g pane-border-style "fg=#363646"
set -g pane-active-border-style "fg=#7e9cd8"
set -g message-style "bg=#2d4f67,fg=#dcd7ba"

# Tell me when something happens in a window I am not watching — useful when a
# background agent finishes.
setw -g monitor-activity on
set -g visual-activity off

# --- added keys --------------------------------------------------------------
# tmux leaves these unbound, so nothing you learn elsewhere is shadowed.

# Reload this file.
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Splits that keep the current directory. The defaults % and " still work and
# still start in your home directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Resize panes without letting go of the prefix.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy mode with the arrow keys and the mouse; press y to copy to the system
# clipboard. `v` starts a selection, as in Vim.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
