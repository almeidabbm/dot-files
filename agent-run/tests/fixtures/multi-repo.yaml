# Fixture for the multi-repo tests: several checkouts, a marked primary, and
# per-repo setup steps that must run in their own checkout.
version: 1
name: multi-repo
description: Compiler test fixture; not a template to dispatch.

runtimes: [codex]

repos:
  - id: github.com/lightdash/lightdash
    ref: main
    path: lightdash
    role: primary
    private: true
    setup:
      - run: pnpm install --frozen-lockfile

  - id: github.com/almeidabbm/dot-files
    path: dot-files
    role: secondary
    setup:
      - run: python3 -m pip install --user jsonschema pyyaml

setup:
  - run: echo cross-repo step

checks:
  - git --version
