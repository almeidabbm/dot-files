version: 1
name: dot-files
description: >
  This repository, as a remote agent sandbox. Public, so it clones anonymously
  and needs no GitHub integration — the smallest end-to-end template, and the
  one to reach for when checking that the pipeline itself works.

resources:
  cpu: 2
  memory: 4GB
  disk: 20GB

runtimes: [codex, claude]

repos:
  - id: github.com/almeidabbm/dot-files
    ref: main
    path: dot-files
    role: primary

setup:
  # Point the chosen runtime at the exe.dev LLM integration gateway. The
  # credential is injected at the network layer, so nothing secret is written
  # to the VM and no per-VM login is needed for either runtime.
  - configure-llm-integration

checks:
  - git --version
  - python3 --version
  - tmux -V
  - codex --version

providers:
  exe.dev:
    image: exeuntu
