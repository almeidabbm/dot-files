version: 1
name: lightdash-dev
description: >
  Lightdash development sandbox. Private repository, so this template needs a
  GitHub integration named `lightdash-lightdash` on the exe.dev account. It is
  attached at VM creation via `--integration`, because a tag-scoped SSH key
  cannot set the tag the integration is attached to.

resources:
  cpu: 4
  memory: 8GB
  disk: 50GB

runtimes: [codex, claude]

repos:
  - id: github.com/lightdash/lightdash
    ref: main
    path: lightdash
    role: primary
    private: true

env:
  NODE_ENV: development

setup:
  # Reach the model through the exe.dev gateway: no login, no key on the VM.
  - configure-llm-integration

  # exeuntu ships git and the agent CLIs but no node, and Ubuntu 24.04's own
  # nodejs is 18. Lightdash needs a current one, so install from NodeSource.
  - run: |
      curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
      sudo apt-get install -y nodejs
      sudo corepack enable
      corepack prepare pnpm@latest --activate

  # The monorepo install is the slow part of readiness. Give dispatch a
  # generous --wait-timeout for this template.
  - run: pnpm install --frozen-lockfile
    cwd: lightdash

checks:
  - git --version
  - node --version
  - pnpm --version
  - tmux -V

providers:
  exe.dev:
    image: exeuntu
    integrations: [lightdash-lightdash]
